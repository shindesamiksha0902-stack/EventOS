<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EVENTOS · Simple & Friendly Event Platform</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,300..900;1,300..900&family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"/>
  
  <!-- Material Symbols Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'eventos-bg': '#FCF6EC',
            'eventos-primary': '#9F3E41',
            'eventos-primary-container': '#F98383',
            'eventos-dark': '#450D0D',
            'eventos-secondary': '#615E57',
            'eventos-border': '#EADFD0',
            'eventos-surface': '#FFFBF5',
          },
          fontFamily: {
            headline: ['"Noto Serif"', 'serif'],
            body: ['"Anybody"', 'sans-serif'],
            label: ['"Archivo Narrow"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css"/>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#F98383] selection:text-[#450D0D] antialiased bg-[#FCF6EC]">

  <!-- Top Navigation Header -->
  <header class="w-full border-b border-[#EADFD0] bg-[#FCF6EC]/95 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3">
        <a href="#auth" onclick="window.app.navigate('auth')" class="flex items-center gap-2 group">
          <div class="w-8 h-8 rounded-lg bg-[#450D0D] text-white flex items-center justify-center font-headline font-bold text-lg shadow-sm group-hover:bg-[#9F3E41] transition-colors">
            E
          </div>
          <span class="font-headline font-semibold text-xl tracking-tight text-[#450D0D]">EVENTOS</span>
        </a>
        <div class="h-4 w-px bg-[#827473]/30 hidden sm:block"></div>
        <span id="header-role-badge" class="hidden sm:inline-block px-3 py-1 rounded-full text-[11px] font-label font-bold uppercase tracking-wider bg-[#9F3E41] text-white">
          VISITOR MODE
        </span>
      </div>

      <!-- Simplified Navigation Links -->
      <nav id="header-nav-links" class="flex items-center gap-6 font-label text-xs uppercase font-bold text-[#450D0D]">
        <!-- Injected by JS -->
      </nav>

      <!-- Switch Mode Button + Live API dot -->
      <div class="flex items-center gap-3">
        <!-- Live API status dot (clickable to configure backend URL) -->
        <button onclick="window.app && window.app.showApiSettingsModal ? window.app.showApiSettingsModal() : alert('API Endpoint: ' + (window.EVENTOS_CONFIG ? window.EVENTOS_CONFIG.API_BASE : 'http://localhost:3001/api'))" class="flex items-center gap-1.5 px-2 py-1 rounded-md hover:bg-black/5 transition-colors cursor-pointer" title="Click to view or change Backend API URL">
          <div id="api-live-dot" class="w-2 h-2 rounded-full bg-gray-300"></div>
          <span id="api-live-label" class="text-[10px] font-label uppercase font-bold text-[#827473] hidden sm:inline">API</span>
        </button>
        <button onclick="window.app.navigate('auth')" class="text-xs font-label uppercase font-bold text-[#9F3E41] hover:text-[#450D0D] flex items-center gap-1 border border-[#EADFD0] px-3 py-1.5 rounded-lg bg-white shadow-2xs">
          <span>Switch Mode</span>
          <span class="material-symbols-outlined text-sm">swap_horiz</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="view-container" class="flex-grow">
    <!-- Active View Injected Dynamically -->
  </main>

  <!-- Global Modal Dialog Backdrop -->
  <div id="global-modal-backdrop" class="fixed inset-0 modal-backdrop z-50 hidden items-center justify-center p-4">
    <div class="paper-card rounded-2xl max-w-md w-full bg-white shadow-2xl relative overflow-hidden">
      <div id="global-modal-content"></div>
    </div>
  </div>

  <!-- Global Toast Notification -->
  <div id="global-toast" class="hidden"></div>

  <!-- Footer -->
  <footer class="w-full border-t border-[#EADFD0] bg-[#FCF6EC] py-6 text-center font-label text-xs text-[#827473]">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <span>EVENTOS · Simple & Friendly Event Platform</span>
      <div class="flex items-center gap-4">
        <a href="#auth" onclick="window.app.navigate('auth')" class="hover:underline">Home</a>
        <a href="#visitor-find" onclick="window.app.setRole('visitor')" class="hover:underline">Visitor View</a>
        <a href="#organizer-overview" onclick="window.app.setRole('organizer')" class="hover:underline">Organizer View</a>
      </div>
    </div>
  </footer>

  <!-- JS Modules -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/spatial-map.js"></script>
  <script src="js/crowd-simulator.js"></script>
  <script src="js/visitor.js"></script>
  <script src="js/organizer.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.app = new window.EventosApp();
    });
  </script>
</body>
</html>
